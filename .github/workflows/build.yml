name: Build + Test v3

on:
  push:
    branches: [ main, develop ] # Build on push to main/develop
  pull_request:
    branches: [ main ] # Also build on PRs to main
  workflow_dispatch: # Allow manual triggering

jobs:
  build:
    name: Build Application
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            archive_name: panda-time-note-linux-amd64.tar.gz
          - os: windows-latest
            archive_name: panda-time-note-windows-amd64.zip
          - os: macos-latest
            archive_name: panda-time-note-macos-amd64.tar.gz
          - os: macos-latest
            archive_name: panda-time-note-macos-arm64.tar.gz
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install linux dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        if: matrix.os == 'ubuntu-latest'
        with:
          packages: libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config xvfb x11-xserver-utils at-spi2-core xdg-desktop-portal-gtk
          version: 1.0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: "go.sum"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install dependencies (macOS only)
        if: matrix.os == 'macos-latest'
        run: |
          brew install upx

      - name: Install dependencies (Windows only)
        if: matrix.os == 'windows-latest'
        run: |
          choco install upx

      - name: Build Wails application
        run: wails3 build -platform ${{ matrix.os }}${{ matrix.arch && format('/{0}', matrix.arch) || '' }}

      - name: Create archives
        run: |
          # Check what was built and create appropriate archives
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            if [ -f "build/bin/panda-time-note.exe" ]; then
              cd build/bin
              7z a -tzip "../../${{ matrix.archive_name }}" panda-time-note.exe
            elif [ -f "bin/panda-time-note.exe" ]; then
              cd bin
              7z a -tzip "../../${{ matrix.archive_name }}" panda-time-note.exe
            fi
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            if [ -d "build/bin/panda-time-note.app" ]; then
              cd build/bin
              tar -czf "../../../${{ matrix.archive_name }}" panda-time-note.app
            elif [ -d "bin/panda-time-note.app" ]; then
              cd bin
              tar -czf "../../${{ matrix.archive_name }}" panda-time-note.app
            fi
          else
            # Linux
            if [ -f "build/bin/panda-time-note" ]; then
              cd build/bin
              tar -czf "../../../${{ matrix.archive_name }}" panda-time-note
            elif [ -f "bin/panda-time-note" ]; then
              cd bin
              tar -czf "../../${{ matrix.archive_name }}" panda-time-note
            fi
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: |
            ${{ matrix.archive_name }}
            build/bin/**
            bin/**

  test_go:
    name: Run Go Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        go-version: [1.24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install linux dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        if: matrix.os == 'ubuntu-latest'
        with:
          packages: libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config xvfb x11-xserver-utils at-spi2-core xdg-desktop-portal-gtk
          version: 1.0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: "go.sum"

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests (mac)
        if: matrix.os == 'macos-latest'
        env:
          CGO_LDFLAGS: -framework UniformTypeIdentifiers -mmacosx-version-min=10.13
        run: go test -v ./...

      - name: Run tests (windows)
        if: matrix.os == 'windows-latest'
        run: go test -v ./...

      - name: Run tests (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: >
          xvfb-run --auto-servernum
          sh -c '
          dbus-update-activation-environment --systemd --all &&
          go test -v ./...
          '

  test_js:
    name: Run JS Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  build_results:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    name: Build Results
    needs: [build, test_go, test_js]
    steps:
      - run: |
          build_result="${{ needs.build.result }}"
          go_result="${{ needs.test_go.result }}"
          js_result="${{ needs.test_js.result }}"
          
          if [[ $build_result == "success" || $build_result == "skipped" ]] && \
             [[ $go_result == "success" || $go_result == "skipped" ]] && \
             [[ $js_result == "success" || $js_result == "skipped" ]]; then
            echo "All required jobs succeeded or were skipped"
            exit 0
          else
            echo "One or more required jobs failed"
            exit 1
          fi

  release:
    name: Create Release
    needs: [build, test_go, test_js]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') # Only create releases for version tags

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -name "*.zip" -exec cp {} release/ \;
          find artifacts -name "*.tar.gz" -exec cp {} release/ \;

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}