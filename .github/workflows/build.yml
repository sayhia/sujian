name: Cross-Platform Build

on:
  push:
    branches: [ main, develop ] # Build on push to main/develop
  pull_request:
    branches: [ main ] # Also build on PRs to main
  workflow_dispatch: # Allow manual triggering

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            archive_name: panda-time-note-linux-amd64.tar.gz
          - os: windows-latest
            archive_name: panda-time-note-windows-amd64.zip
          - os: macos-latest
            archive_name: panda-time-note-macos-amd64.tar.gz
          - os: macos-latest
            archive_name: panda-time-note-macos-arm64.tar.gz
            arch: arm64

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25' # Wails v3 requires Go 1.25+

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Wails v3 CLI
      run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

    - name: Install dependencies (Linux only)
      if: matrix.os == 'ubuntu-latest'
      run: |
        # Install Wails v3 dependencies for Ubuntu
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          pkg-config \
          libgtk-3-dev \
          libwebkit2gtk-4.1-dev \
          librsvg2-dev \
          libpango1.0-dev \
          libcairo2-dev \
          libgdk-pixbuf2.0-dev \
          libglib2.0-dev \
          libjavascriptcoregtk-4.1-dev \
          libatk1.0-dev \
          libatspi2.0-dev \
          libgtk-3-0 \
          libgdk-pixbuf2.0-0 \
          libpango-1.0-0 \
          libcairo-gobject2 \
          libgtksourceview-3.0-dev || \
        sudo apt-get install -y \
          build-essential \
          pkg-config \
          libgtk-3-dev \
          libwebkit2gtk-4.0-dev \
          librsvg2-dev \
          libpango1.0-dev \
          libcairo2-dev \
          libgdk-pixbuf2.0-dev \
          libglib2.0-dev \
          libjavascriptcoregtk-4.0-dev \
          libatk1.0-dev \
          libatspi2.0-dev \
          libgtk-3-0 \
          libgdk-pixbuf2.0-0 \
          libpango-1.0-0 \
          libcairo-gobject2 \
          libgtksourceview-3.0-dev

    - name: Install dependencies (macOS only)
      if: matrix.os == 'macos-latest'
      run: |
        brew install upx

    - name: Install dependencies (Windows only)
      if: matrix.os == 'windows-latest'
      run: |
        choco install upx

    - name: Build Wails application
      run: wails3 build

    - name: Create archives
      run: |
        # Check what was built and create appropriate archives
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          if [ -f "build/bin/panda-time-note.exe" ]; then
            cd build/bin
            7z a -tzip "../../${{ matrix.archive_name }}" panda-time-note.exe
          elif [ -f "bin/panda-time-note.exe" ]; then
            cd bin
            7z a -tzip "../../${{ matrix.archive_name }}" panda-time-note.exe
          fi
        elif [ "${{ matrix.os }}" = "macos-latest" ]; then
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            # For ARM64, we need to build with specific flag
            export GOARCH=arm64
            wails3 build
          fi
          
          if [ -d "build/bin/panda-time-note.app" ]; then
            cd build/bin
            tar -czf "../../../${{ matrix.archive_name }}" panda-time-note.app
          elif [ -d "bin/panda-time-note.app" ]; then
            cd bin
            tar -czf "../../${{ matrix.archive_name }}" panda-time-note.app
          fi
        else
          # Linux
          if [ -f "build/bin/panda-time-note" ]; then
            cd build/bin
            tar -czf "../../../${{ matrix.archive_name }}" panda-time-note
          elif [ -f "bin/panda-time-note" ]; then
            cd bin
            tar -czf "../../${{ matrix.archive_name }}" panda-time-note
          fi
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.archive_name }}
        path: |
          ${{ matrix.archive_name }}
          build/bin/**
          bin/**

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') # Only create releases for version tags

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare release files
      run: |
        mkdir -p release
        find artifacts -name "*.zip" -exec cp {} release/ \;
        find artifacts -name "*.tar.gz" -exec cp {} release/ \;

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: release/*
        generate_release_notes: true
        draft: false
        prerelease: false
        name: Release ${{ github.ref_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}