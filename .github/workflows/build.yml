name: Build and Release

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  GO_VERSION: '1.23'
  NODE_VERSION: '20'

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            runner: windows-latest
            archive_name: panda-time-note-windows-amd64.zip
          - os: darwin-latest
            runner: macos-latest
            archive_name: panda-time-note-macos-amd64.tar.gz
            arch: amd64
          - os: darwin-latest
            runner: macos-latest
            archive_name: panda-time-note-macos-arm64.tar.gz
            arch: arm64
          - os: linux-latest
            runner: ubuntu-latest
            archive_name: panda-time-note-linux-amd64.tar.gz

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'linux-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.1-dev || \
        sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.0-dev || \
        sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.0-37-gtk2.0-0

    - name: Install system dependencies (macOS)
      if: matrix.os == 'darwin-latest'
      run: |
        brew install upx

    - name: Install system dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        choco install upx

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Build frontend
      working-directory: frontend
      run: npm run build

    - name: Build Go application (Linux)
      if: matrix.os == 'linux-latest'
      run: |
        export GOOS=linux
        export GOARCH=amd64
        export CGO_ENABLED=1
        echo "Building for Linux/amd64"
        mkdir -p build/bin
        go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o build/bin/panda-time-note main.go
        if command -v upx &> /dev/null; then
          upx --best build/bin/panda-time-note
        fi

    - name: Build Go application (macOS)
      if: matrix.os == 'darwin-latest'
      run: |
        export GOOS=darwin
        export GOARCH=${{ matrix.arch }}
        export CGO_ENABLED=1
        export MACOSX_DEPLOYMENT_TARGET=10.15
        echo "Building for macOS/${{ matrix.arch }}"
        mkdir -p build/bin
        
        APP_NAME="panda-time-note"
        if [ "${{ matrix.arch }}" = "arm64" ]; then
          APP_NAME="panda-time-note-arm64"
        fi
        
        go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o "build/bin/${APP_NAME}" main.go
        
        APP_DIR="build/bin/${APP_NAME}.app"
        mkdir -p "$APP_DIR/Contents/MacOS"
        mkdir -p "$APP_DIR/Contents/Resources"
        
        # Create Info.plist using printf
        printf '<?xml version="1.0" encoding="UTF-8"?>\n' > "$APP_DIR/Contents/Info.plist"
        printf '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n' >> "$APP_DIR/Contents/Info.plist"
        printf '<plist version="1.0">\n' >> "$APP_DIR/Contents/Info.plist"
        printf '<dict>\n' >> "$APP_DIR/Contents/Info.plist"
        printf '    <key>CFBundleDisplayName</key>\n' >> "$APP_DIR/Contents/Info.plist"
        printf '    <string>Panda Time-Note</string>\n' >> "$APP_DIR/Contents/Info.plist"
        printf '    <key>CFBundleExecutable</key>\n' >> "$APP_DIR/Contents/Info.plist"
        printf '    <string>panda-time-note</string>\n' >> "$APP_DIR/Contents/Info.plist"
        printf '    <key>CFBundleIdentifier</key>\n' >> "$APP_DIR/Contents/Info.plist"
        printf '    <string>com.panda.time-note</string>\n' >> "$APP_DIR/Contents/Info.plist"
        printf '    <key>CFBundleName</key>\n' >> "$APP_DIR/Contents/Info.plist"
        printf '    <string>Panda Time-Note</string>\n' >> "$APP_DIR/Contents/Info.plist"
        printf '    <key>CFBundlePackageType</key>\n' >> "$APP_DIR/Contents/Info.plist"
        printf '    <string>APPL</string>\n' >> "$APP_DIR/Contents/Info.plist"
        printf '    <key>CFBundleShortVersionString</key>\n' >> "$APP_DIR/Contents/Info.plist"
        printf '    <string>1.0.0</string>\n' >> "$APP_DIR/Contents/Info.plist"
        printf '    <key>CFBundleVersion</key>\n' >> "$APP_DIR/Contents/Info.plist"
        printf '    <string>1</string>\n' >> "$APP_DIR/Contents/Info.plist"
        printf '    <key>LSMinimumSystemVersion</key>\n' >> "$APP_DIR/Contents/Info.plist"
        printf '    <string>10.15</string>\n' >> "$APP_DIR/Contents/Info.plist"
        printf '    <key>NSHighResolutionCapable</key>\n' >> "$APP_DIR/Contents/Info.plist"
        printf '    <true/>\n' >> "$APP_DIR/Contents/Info.plist"
        printf '</dict>\n' >> "$APP_DIR/Contents/Info.plist"
        printf '</plist>\n' >> "$APP_DIR/Contents/Info.plist"
        
        if [ "${{ matrix.arch }}" = "arm64" ]; then
          mv "build/bin/panda-time-note-arm64" "$APP_DIR/Contents/MacOS/panda-time-note"
        else
          mv "build/bin/panda-time-note" "$APP_DIR/Contents/MacOS/"
        fi
        
        # Skip UPX compression for macOS as it's not supported
        # if command -v upx &> /dev/null; then
        #   upx --best --force-macos "$APP_DIR/Contents/MacOS/panda-time-note"
        # fi

    - name: Build Go application (Windows)
      if: matrix.os == 'windows-latest'
      shell: powershell
      run: |
        $env:GOOS = "windows"
        $env:GOARCH = "amd64"
        $env:CGO_ENABLED = "1"
        echo "Building for Windows/amd64"
        New-Item -ItemType Directory -Force -Path build/bin
        go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o build/bin/panda-time-note.exe main.go
        if (Get-Command upx -ErrorAction SilentlyContinue) {
          upx --best build/bin/panda-time-note.exe
        }

    - name: Create archives (Linux)
      if: matrix.os == 'linux-latest'
      run: |
        cd build/bin
        tar -czf "../../../${{ matrix.archive_name }}" panda-time-note

    - name: Create archives (macOS)
      if: matrix.os == 'darwin-latest'
      run: |
        cd build/bin
        if [ "${{ matrix.arch }}" = "arm64" ]; then
          tar -czf "../../../${{ matrix.archive_name }}" panda-time-note-arm64.app
        else
          tar -czf "../../../${{ matrix.archive_name }}" panda-time-note.app
        fi

    - name: Create archives (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        cd build/bin
        7z a -tzip "../../${{ matrix.archive_name }}" panda-time-note.exe

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.archive_name }}
        path: ${{ matrix.archive_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare release files
      run: |
        mkdir -p release
        find artifacts -name "*.zip" -exec cp {} release/ \;
        find artifacts -name "*.tar.gz" -exec cp {} release/ \;

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: release/*
        generate_release_notes: true
        draft: false
        prerelease: false
        name: Release ${{ github.ref_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
