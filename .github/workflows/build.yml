name: Build and Release

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  GO_VERSION: '1.23'
  NODE_VERSION: '20'

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            runner: windows-latest
            archive_name: panda-time-note-windows-amd64.zip
          - os: darwin-latest
            runner: macos-latest
            archive_name: panda-time-note-macos-amd64.tar.gz
            arch: amd64
          - os: darwin-latest
            runner: macos-latest
            archive_name: panda-time-note-macos-arm64.tar.gz
            arch: arm64
          - os: linux-latest
            runner: ubuntu-latest
            archive_name: panda-time-note-linux-amd64.tar.gz

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'linux-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.0-dev

    - name: Install system dependencies (macOS)
      if: matrix.os == 'darwin-latest'
      run: |
        brew install upx

    - name: Install system dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        choco install upx

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Build frontend
      working-directory: frontend
      run: npm run build

    - name: Build Go application (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        if [ "${{ matrix.os }}" = "darwin-latest" ]; then
          export GOOS=darwin
        else
          export GOOS=linux
        fi
        
        if [ "${{ matrix.arch }}" != "" ]; then
          export GOARCH=${{ matrix.arch }}
        else
          export GOARCH=amd64
        fi
        
        export CGO_ENABLED=1
        echo "Building for $GOOS/$GOARCH"
        mkdir -p build/bin
        
        if [ "$GOOS" = "darwin" ]; then
          APP_NAME="panda-time-note"
          if [ "$GOARCH" = "arm64" ]; then
            APP_NAME="panda-time-note-arm64"
          fi
          go build -ldflags="-s -w" -o "build/bin/${APP_NAME}" main.go
          
          APP_DIR="build/bin/${APP_NAME}.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"
          
          cat > "$APP_DIR/Contents/Info.plist" << 'PLIST'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>CFBundleDisplayName</key>
    <string>Panda Time-Note</string>
    <key>CFBundleExecutable</key>
    <string>panda-time-note</string>
    <key>CFBundleIdentifier</key>
    <string>com.panda.time-note</string>
    <key>CFBundleName</key>
    <string>Panda Time-Note</string>
    <key>CFBundlePackageType</key>
    <string>APPL</string>
    <key>CFBundleShortVersionString</key>
    <string>1.0.0</string>
    <key>CFBundleVersion</key>
    <string>1</string>
    <key>LSMinimumSystemVersion</key>
    <string>10.15</string>
    <key>NSHighResolutionCapable</key>
    <true/>
</dict>
</plist>
PLIST
          if [ "$GOARCH" = "arm64" ]; then
            mv "build/bin/panda-time-note-arm64" "$APP_DIR/Contents/MacOS/panda-time-note"
          else
            mv "build/bin/panda-time-note" "$APP_DIR/Contents/MacOS/"
          fi
        else
          go build -ldflags="-s -w" -o build/bin/panda-time-note main.go
        fi
        
        if command -v upx &> /dev/null; then
          find build/bin -type f -executable -exec upx --best {} \;
        fi

    - name: Build Go application (Windows)
      if: matrix.os == 'windows-latest'
      shell: powershell
      run: |
        $env:GOOS = "windows"
        $env:GOARCH = "amd64"
        $env:CGO_ENABLED = "1"
        echo "Building for Windows/amd64"
        New-Item -ItemType Directory -Force -Path build/bin
        go build -ldflags="-s -w" -o build/bin/panda-time-note.exe main.go
        if (Get-Command upx -ErrorAction SilentlyContinue) {
          upx --best build/bin/panda-time-note.exe
        }

    - name: Create archives (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        cd build/bin
        if [ "${{ matrix.os }}" = "darwin-latest" ]; then
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            tar -czf "../../../${{ matrix.archive_name }}" panda-time-note-arm64.app
          else
            tar -czf "../../../${{ matrix.archive_name }}" panda-time-note.app
          fi
        else
          tar -czf "../../../${{ matrix.archive_name }}" panda-time-note
        fi

    - name: Create archives (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        cd build/bin
        7z a -tzip "../../${{ matrix.archive_name }}" panda-time-note.exe

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.archive_name }}
        path: ${{ matrix.archive_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare release files
      run: |
        mkdir -p release
        find artifacts -name "*.zip" -exec cp {} release/ \;
        find artifacts -name "*.tar.gz" -exec cp {} release/ \;

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: release/*
        generate_release_notes: true
        draft: false
        prerelease: false
        name: Release ${{ github.ref_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
