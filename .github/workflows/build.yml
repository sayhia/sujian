name: Build and Release

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '20'

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            runner: windows-latest
            archive_name: panda-time-note-windows-amd64.zip
          - os: darwin-latest
            runner: macos-latest
            archive_name: panda-time-note-macos-amd64.tar.gz
            arch: amd64
          - os: darwin-latest
            runner: macos-latest
            archive_name: panda-time-note-macos-arm64.tar.gz
            arch: arm64
          - os: linux-latest
            runner: ubuntu-latest
            archive_name: panda-time-note-linux-amd64.tar.gz

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'linux-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.1-dev || \
        sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.0-dev || \
        sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.0-37-gtk2.0-0

    - name: Install system dependencies (macOS)
      if: matrix.os == 'darwin-latest'
      run: |
        brew install upx

    - name: Install system dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        choco install upx

    - name: Install Wails CLI
      run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

    - name: Build Wails application (Debug help)
      run: |
        echo "Wails version:"
        wails3 version
        echo "Wails build help:"
        wails3 build --help

    - name: Install Task
      run: go install github.com/go-task/task/v3/cmd/task@latest

    - name: Build application
      run: |
        # Check current directory and files
        echo "Current directory: $(pwd)"
        echo "Files in current directory:"
        ls -la
        
        # Clean previous builds
        rm -rf build/
        
        # Use Task to build (which is what Wails projects expect)
        echo "Starting build with Task..."
        task build
        
        # Check what was created
        echo "Build directory contents:"
        find . -name "build" -type d -exec ls -la {} \; 2>/dev/null || echo "No build directory found"

    - name: Create archives (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        echo "Creating archive for ${{ matrix.os }}"
        echo "Current directory: $(pwd)"
        echo "Looking for build artifacts:"
        find . -name "*.app" -o -name "panda-time-note" -o -name "*.exe" 2>/dev/null || echo "No artifacts found"
        
        # Try different possible locations
        if [ -d "build/bin" ]; then
          echo "Found build/bin directory"
          ls -la build/bin/
        fi
        
        if [ -d "build" ]; then
          echo "Found build directory"
          ls -la build/
        fi
        
        # Find and create archives
        if [ "${{ matrix.os }}" = "darwin-latest" ]; then
          # Look for .app in different locations
          APP_PATH=""
          if [ -d "build/bin/panda-time-note.app" ]; then
            APP_PATH="build/bin/panda-time-note.app"
          elif [ -d "build/panda-time-note.app" ]; then
            APP_PATH="build/panda-time-note.app"
          fi
          
          if [ -n "$APP_PATH" ]; then
            echo "Found app at $APP_PATH"
            cd "$(dirname "$APP_PATH")"
            tar -czf "../../../${{ matrix.archive_name }}" "$(basename "$APP_PATH")"
          else
            echo "No .app found, creating archive from root"
            tar -czf "${{ matrix.archive_name }}" * 2>/dev/null || echo "Archive creation failed"
          fi
        else
          # Linux creates executable
          EXE_PATH=""
          if [ -f "build/bin/panda-time-note" ]; then
            EXE_PATH="build/bin/panda-time-note"
          elif [ -f "build/panda-time-note" ]; then
            EXE_PATH="build/panda-time-note"
          fi
          
          if [ -n "$EXE_PATH" ]; then
            echo "Found executable at $EXE_PATH"
            cd "$(dirname "$EXE_PATH")"
            tar -czf "../../../${{ matrix.archive_name }}" "$(basename "$EXE_PATH")"
          else
            echo "No executable found"
          fi
        fi
          else
            # Create macOS Intel archive
            if [ -d "build/bin/panda-time-note.app" ]; then
              cd build/bin
              tar -czf "../../../${{ matrix.archive_name }}" panda-time-note.app
            fi
          fi
        else
          # Linux creates executable
          if [ -f "build/bin/panda-time-note" ]; then
            cd build/bin
            tar -czf "../../../${{ matrix.archive_name }}" panda-time-note
          fi
        fi

    - name: Create archives (Windows)
      if: matrix.os == 'windows-latest'
      shell: powershell
      run: |
        # Wails creates .exe on Windows
        Write-Host "Looking for Windows executable..."
        Get-ChildItem -Path . -Recurse -Name "*.exe" -ErrorAction SilentlyContinue
        
        # Check multiple possible locations
        $exePath = ""
        if (Test-Path "build/bin/panda-time-note.exe") {
          $exePath = "build/bin/panda-time-note.exe"
        } elseif (Test-Path "build/panda-time-note.exe") {
          $exePath = "build/panda-time-note.exe"
        }
        
        if ($exePath) {
          Write-Host "Found executable at $exePath"
          $dir = Split-Path $exePath -Parent
          $file = Split-Path $exePath -Leaf
          Set-Location $dir
          7z a -tzip "../../${{ matrix.archive_name }}" $file
        } else {
          Write-Host "No executable found, trying to create archive from root"
          7z a -tzip "${{ matrix.archive_name }}" * -r 2>$null
        }

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.archive_name }}
        path: |
          ${{ matrix.archive_name }}
          build/**/*
          *.app
          *.exe
          panda-time-note

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare release files
      run: |
        mkdir -p release
        find artifacts -name "*.zip" -exec cp {} release/ \;
        find artifacts -name "*.tar.gz" -exec cp {} release/ \;

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: release/*
        generate_release_notes: true
        draft: false
        prerelease: false
        name: Release ${{ github.ref_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
