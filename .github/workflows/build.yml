name: Build and Release

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '20'

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            runner: windows-latest
            archive_name: panda-time-note-windows-amd64.zip
          - os: darwin-latest
            runner: macos-latest
            archive_name: panda-time-note-macos-amd64.tar.gz
            arch: amd64
          - os: darwin-latest
            runner: macos-latest
            archive_name: panda-time-note-macos-arm64.tar.gz
            arch: arm64
          - os: linux-latest
            runner: ubuntu-latest
            archive_name: panda-time-note-linux-amd64.tar.gz

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'linux-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.1-dev || \
        sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.0-dev || \
        sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.0-37-gtk2.0-0

    - name: Install system dependencies (macOS)
      if: matrix.os == 'darwin-latest'
      run: |
        brew install upx

    - name: Install system dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        choco install upx

    - name: Install Wails CLI
      run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

    - name: Build Wails application (Debug help)
      run: |
        echo "Wails version:"
        wails3 version
        echo "Wails build help:"
        wails3 build --help

    - name: Build Wails application
      run: |
        # Try with correct flag format based on error message
        wails3 build clean

    - name: Create archives (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        if [ "${{ matrix.os }}" = "darwin-latest" ]; then
          # Wails creates .app bundles on macOS
          cd build/bin
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            tar -czf "../../../${{ matrix.archive_name }}" panda-time-note.app
          else
            tar -czf "../../../${{ matrix.archive_name }}" panda-time-note.app
          fi
        else
          # Linux creates executable
          cd build/bin
          tar -czf "../../../${{ matrix.archive_name }}" panda-time-note
        fi

    - name: Create archives (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        # Wails creates .exe on Windows
        cd build/bin
        7z a -tzip "../../${{ matrix.archive_name }}" panda-time-note.exe

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.archive_name }}
        path: ${{ matrix.archive_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare release files
      run: |
        mkdir -p release
        find artifacts -name "*.zip" -exec cp {} release/ \;
        find artifacts -name "*.tar.gz" -exec cp {} release/ \;

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: release/*
        generate_release_notes: true
        draft: false
        prerelease: false
        name: Release ${{ github.ref_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
