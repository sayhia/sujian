# CI — 质量门禁
#
# 触发条件：push / PR 到 main
# 职责：
#   1. 前端：依赖安装（lock 可复现）→ 类型检查 + 生产构建（vue-tsc + vite）→ vitest 单元测试
#   2. 后端：go vet + CGO 编译验证（项目依赖 mattn/go-sqlite3，必须 CGO + C 编译器）
#   3. 三平台矩阵验证（Linux / macOS arm64 / Windows amd64），确保每平台都能产出可执行文件
#
# 说明：
#   - Windows 平台的 CGO 编译需要 mingw-w64 gcc（choco 安装）
#   - 产物以 artifact 形式上传，PR 调试时可下载

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "22"

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            output: bin/sujian
          - name: macos-arm64
            os: macos-14
            output: bin/sujian
          - name: windows-amd64
            os: windows-latest
            output: bin/sujian.exe
            ldflags: -H windowsgui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # mattn/go-sqlite3 是 CGO 依赖，Windows 需要 mingw-w64 gcc
      - name: Install C toolchain (Windows)
        if: runner.os == 'Windows'
        run: choco install mingw -y --no-progress

      # Linux 的 Wails GUI 后端经 cgo 链接 GTK/WebKit（alpha2 线已切换到 GTK4），
      # go vet / go build 需要 gtk4 + webkitgtk-6.0 开发库
      - name: Install WebKit/GTK dev packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-4-dev libwebkitgtk-6.0-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check & build frontend
        working-directory: frontend
        run: npm run build

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test -- --passWithNoTests

      - name: Vet Go code
        run: go vet ./...

      - name: Build Go binary (CGO)
        env:
          CGO_ENABLED: "1"
        run: go build -tags production -trimpath -buildvcs=false -ldflags="-w -s ${{ matrix.ldflags }}" -o ${{ matrix.output }} main.go

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.output }}
          if-no-files-found: error
